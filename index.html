<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Flappy Blob</title>
<style>
  :root {
    --sky-top: #6ec6ff;
    --sky-bottom: #cdeffd;
    --ground: #ded17a;
    --ground-dark: #c2b45a;
    --pipe: #4CAF50;
    --pipe-dark: #2e7d32;
    --text: #2b2b2b;
    --card-bg: rgba(255,255,255,0.9);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --sky-top: #1a2340;
      --sky-bottom: #2f3d63;
      --ground: #5a5230;
      --ground-dark: #453f24;
      --text: #f0f0f0;
      --card-bg: rgba(30,30,40,0.9);
    }
  }
  :root[data-theme="dark"] {
    --sky-top: #1a2340;
    --sky-bottom: #2f3d63;
    --ground: #5a5230;
    --ground-dark: #453f24;
    --text: #f0f0f0;
    --card-bg: rgba(30,30,40,0.9);
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: var(--sky-bottom);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: var(--text);
    overflow: hidden;
    touch-action: manipulation;
  }

  #wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    width: 100%;
    position: relative;
  }

  #gameContainer {
    position: relative;
    width: 100%;
    max-width: 480px;
    height: 100%;
    max-height: 720px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.25);
    border-radius: 8px;
    overflow: hidden;
    background: linear-gradient(var(--sky-top), var(--sky-bottom));
  }

  canvas {
    display: block;
    width: 100%;
    height: 100%;
    cursor: pointer;
  }

  #hud {
    position: absolute;
    top: 16px;
    left: 0;
    right: 0;
    text-align: center;
    font-size: 2.2em;
    font-weight: 800;
    color: white;
    text-shadow: 2px 2px 0 rgba(0,0,0,0.35), -1px -1px 0 rgba(0,0,0,0.2);
    pointer-events: none;
    z-index: 5;
  }

  #bestBadge {
    position: absolute;
    top: 62px;
    left: 0;
    right: 0;
    text-align: center;
    font-size: 0.85em;
    font-weight: 600;
    color: white;
    text-shadow: 1px 1px 0 rgba(0,0,0,0.35);
    pointer-events: none;
    z-index: 5;
  }

  #overlay {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    text-align: center;
    z-index: 10;
    background: rgba(0,0,0,0.15);
  }

  #panel {
    background: var(--card-bg);
    padding: 28px 32px;
    border-radius: 16px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.3);
    max-width: 80%;
  }

  #panel h1 {
    margin: 0 0 6px;
    font-size: 1.6em;
  }

  #panel p {
    margin: 4px 0 18px;
    opacity: 0.8;
    font-size: 0.95em;
  }

  #panel .score-line {
    font-size: 1.1em;
    margin-bottom: 4px;
  }

  #panel .big-score {
    font-size: 2.4em;
    font-weight: 800;
    margin: 6px 0 14px;
  }

  button {
    font-family: inherit;
    font-size: 1.05em;
    font-weight: 700;
    padding: 12px 28px;
    border-radius: 999px;
    border: none;
    background: var(--pipe);
    color: white;
    cursor: pointer;
    box-shadow: 0 4px 0 var(--pipe-dark);
    transition: transform 0.05s ease;
  }
  button:active {
    transform: translateY(3px);
    box-shadow: 0 1px 0 var(--pipe-dark);
  }

  #hint {
    position: absolute;
    bottom: 90px;
    left: 0;
    right: 0;
    text-align: center;
    color: white;
    font-weight: 600;
    text-shadow: 1px 1px 0 rgba(0,0,0,0.35);
    z-index: 4;
    pointer-events: none;
    animation: pulse 1.4s infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 0.55; }
    50% { opacity: 1; }
  }
</style>
</head>
<body>
<div id="wrap">
  <div id="gameContainer">
    <canvas id="game"></canvas>
    <div id="hud">0</div>
    <div id="bestBadge"></div>
    <div id="hint">Tap / Click / Space to flap</div>
    <div id="overlay">
      <div id="panel">
        <h1>🐤 Flappy Blob</h1>
        <p>Tap, click, or press Space to flap. Don't hit the pipes!</p>
        <button id="startBtn">Start Game</button>
      </div>
    </div>
  </div>
</div>

<script>
(function() {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const hud = document.getElementById('hud');
  const bestBadge = document.getElementById('bestBadge');
  const overlay = document.getElementById('overlay');
  const panel = document.getElementById('panel');
  const startBtn = document.getElementById('startBtn');
  const hint = document.getElementById('hint');
  const container = document.getElementById('gameContainer');

  // Logical game resolution (scaled to fit container via CSS)
  const W = 480;
  const H = 720;
  canvas.width = W;
  canvas.height = H;

  const GROUND_H = 90;

  let bestScore = 0;
  try {
    const saved = localStorage.getItem('flappyBlobBest');
    if (saved) bestScore = parseInt(saved, 10) || 0;
  } catch (e) { /* storage unavailable, ignore */ }

  function saveBest() {
    try { localStorage.setItem('flappyBlobBest', String(bestScore)); } catch (e) {}
  }

  let state = 'ready'; // ready | playing | dead
  let frame = 0;
  let score = 0;
  let groundOffset = 0;

  const bird = {
    x: W * 0.28,
    y: H / 2,
    r: 16,
    vy: 0,
    rot: 0
  };

  const GRAVITY = 0.45;
  const FLAP_VY = -8.2;
  const MAX_FALL = 11;

  const PIPE_GAP = 165;
  const PIPE_W = 70;
  const PIPE_SPEED = 2.6;
  const PIPE_INTERVAL = 105; // frames

  let pipes = [];

  function resetGame() {
    bird.y = H / 2;
    bird.vy = 0;
    bird.rot = 0;
    pipes = [];
    score = 0;
    frame = 0;
    groundOffset = 0;
    hud.textContent = '0';
  }

  function spawnPipe() {
    const margin = 60;
    const usableH = H - GROUND_H - margin * 2 - PIPE_GAP;
    const topH = margin + Math.random() * Math.max(usableH, 40);
    pipes.push({
      x: W + PIPE_W,
      topH: topH,
      passed: false
    });
  }

  function flap() {
    if (state === 'ready') {
      startGame();
      return;
    }
    if (state === 'dead') return;
    bird.vy = FLAP_VY;
  }

  function startGame() {
    resetGame();
    state = 'playing';
    overlay.style.display = 'none';
    hint.style.display = 'none';
    bird.vy = FLAP_VY;
  }

  function endGame() {
    state = 'dead';
    if (score > bestScore) {
      bestScore = score;
      saveBest();
    }
    panel.innerHTML =
      '<h1>💥 Game Over</h1>' +
      '<div class="score-line">Score</div>' +
      '<div class="big-score">' + score + '</div>' +
      '<div class="score-line">Best: ' + bestScore + '</div>' +
      '<button id="startBtn2">Play Again</button>';
    overlay.style.display = 'flex';
    document.getElementById('startBtn2').addEventListener('click', (e) => {
      e.stopPropagation();
      startGame();
    });
  }

  function rectCircleCollide(cx, cy, cr, rx, ry, rw, rh) {
    const closestX = Math.max(rx, Math.min(cx, rx + rw));
    const closestY = Math.max(ry, Math.min(cy, ry + rh));
    const dx = cx - closestX;
    const dy = cy - closestY;
    return (dx * dx + dy * dy) < (cr * cr);
  }

  function update() {
    if (state !== 'playing') return;
    frame++;

    bird.vy += GRAVITY;
    if (bird.vy > MAX_FALL) bird.vy = MAX_FALL;
    bird.y += bird.vy;

    bird.rot = Math.max(-0.5, Math.min(1.2, bird.vy / 10));

    if (frame % PIPE_INTERVAL === 0) spawnPipe();

    for (let i = pipes.length - 1; i >= 0; i--) {
      const p = pipes[i];
      p.x -= PIPE_SPEED;

      if (!p.passed && p.x + PIPE_W < bird.x - bird.r) {
        p.passed = true;
        score++;
        hud.textContent = score;
      }

      const bottomY = p.topH + PIPE_GAP;
      const bottomH = (H - GROUND_H) - bottomY;

      if (rectCircleCollide(bird.x, bird.y, bird.r * 0.8, p.x, 0, PIPE_W, p.topH) ||
          rectCircleCollide(bird.x, bird.y, bird.r * 0.8, p.x, bottomY, PIPE_W, bottomH)) {
        endGame();
      }

      if (p.x + PIPE_W < 0) pipes.splice(i, 1);
    }

    if (bird.y + bird.r > H - GROUND_H) {
      bird.y = H - GROUND_H - bird.r;
      endGame();
    }
    if (bird.y - bird.r < 0) {
      bird.y = bird.r;
      bird.vy = 0;
    }

    groundOffset = (groundOffset + PIPE_SPEED) % 24;
  }

  function drawBackgroundClouds() {
    ctx.save();
    ctx.fillStyle = 'rgba(255,255,255,0.6)';
    const t = frame * 0.15;
    for (let i = 0; i < 4; i++) {
      const cx = ((i * 160 - (t % 640)) + 640) % 640 - 80;
      const cy = 90 + i * 60 % 200;
      ctx.beginPath();
      ctx.ellipse(cx, cy, 40, 16, 0, 0, Math.PI * 2);
      ctx.ellipse(cx + 25, cy + 6, 26, 12, 0, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }

  function drawPipes() {
    pipes.forEach(p => {
      const bottomY = p.topH + PIPE_GAP;
      const bottomH = (H - GROUND_H) - bottomY;

      // top pipe
      const gradTop = ctx.createLinearGradient(p.x, 0, p.x + PIPE_W, 0);
      gradTop.addColorStop(0, '#3f9142');
      gradTop.addColorStop(0.5, '#5fc463');
      gradTop.addColorStop(1, '#3f9142');
      ctx.fillStyle = gradTop;
      ctx.fillRect(p.x, 0, PIPE_W, p.topH);
      ctx.fillStyle = '#2e7d32';
      ctx.fillRect(p.x - 4, p.topH - 24, PIPE_W + 8, 24);

      // bottom pipe
      ctx.fillStyle = gradTop;
      ctx.fillRect(p.x, bottomY, PIPE_W, bottomH);
      ctx.fillStyle = '#2e7d32';
      ctx.fillRect(p.x - 4, bottomY, PIPE_W + 8, 24);
    });
  }

  function drawGround() {
    ctx.fillStyle = getCssVar('--ground');
    ctx.fillRect(0, H - GROUND_H, W, GROUND_H);
    ctx.fillStyle = getCssVar('--ground-dark');
    ctx.fillRect(0, H - GROUND_H, W, 10);
    ctx.save();
    ctx.translate(-groundOffset, 0);
    for (let x = -24; x < W + 24; x += 24) {
      ctx.fillRect(x, H - GROUND_H + 18, 12, 12);
    }
    ctx.restore();
  }

  function getCssVar(name) {
    return getComputedStyle(document.documentElement).getPropertyValue(name).trim() || '#ded17a';
  }

  function drawBird() {
    ctx.save();
    ctx.translate(bird.x, bird.y);
    ctx.rotate(bird.rot);

    // body
    ctx.fillStyle = '#ffd54f';
    ctx.beginPath();
    ctx.ellipse(0, 0, bird.r, bird.r * 0.85, 0, 0, Math.PI * 2);
    ctx.fill();

    // wing
    const wingFlap = Math.sin(frame * 0.4) * 4;
    ctx.fillStyle = '#ffb300';
    ctx.beginPath();
    ctx.ellipse(-4, 2 + wingFlap * 0.3, 9, 6, -0.3, 0, Math.PI * 2);
    ctx.fill();

    // eye
    ctx.fillStyle = '#333';
    ctx.beginPath();
    ctx.arc(6, -4, 2.5, 0, Math.PI * 2);
    ctx.fill();

    // beak
    ctx.fillStyle = '#ff7043';
    ctx.beginPath();
    ctx.moveTo(bird.r - 2, -2);
    ctx.lineTo(bird.r + 9, 1);
    ctx.lineTo(bird.r - 2, 5);
    ctx.closePath();
    ctx.fill();

    ctx.restore();
  }

  function render() {
    ctx.clearRect(0, 0, W, H);

    const skyTop = getCssVar('--sky-top');
    const skyBottom = getCssVar('--sky-bottom');
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, skyTop);
    g.addColorStop(1, skyBottom);
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    drawBackgroundClouds();
    drawPipes();
    drawGround();
    drawBird();
  }

  function loop() {
    update();
    render();
    requestAnimationFrame(loop);
  }

  // Input handling
  function handleInput(e) {
    e.preventDefault();
    flap();
  }
  canvas.addEventListener('mousedown', handleInput);
  canvas.addEventListener('touchstart', handleInput, { passive: false });
  window.addEventListener('keydown', (e) => {
    if (e.code === 'Space' || e.code === 'ArrowUp') {
      e.preventDefault();
      flap();
    }
  });
  startBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    startGame();
  });

  if (bestScore > 0) {
    bestBadge.textContent = 'Best: ' + bestScore;
  }

  resetGame();
  render();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
