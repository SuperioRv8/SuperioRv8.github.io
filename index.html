<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>superior's library</title>
<style>
  :root{
    --bg:#000000;
    --green:#00ff41;
    --green-dim:#0a5c1e;
    --green-mid:#1fa93c;
    --border:#00ff41;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--green);
    font-family: "Courier New", Consolas, monospace;
    min-height: 100vh;
  }

  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px 16px;
  }

  .header {
    border: 2px solid var(--border);
    padding: 14px 24px;
    margin-bottom: 40px;
    width: 100%;
    max-width: 620px;
    text-align: center;
  }

  .header h1 {
    margin: 0;
    font-size: 1.4rem;
    font-weight: normal;
    letter-spacing: 2px;
  }

  .header .sub {
    font-size: 0.75rem;
    color: var(--green-mid);
    margin-top: 6px;
  }

  .panel {
    width: 100%;
    max-width: 620px;
    border: 2px solid var(--border);
    padding: 24px;
  }

  .line {
    font-size: 0.85rem;
    margin-bottom: 18px;
  }

  /* --- Unlock slider --- */
  #unlock-screen .instructions {
    margin-bottom: 24px;
  }

  input[type="range"] {
    -webkit-appearance: none;
    width: 100%;
    height: 28px;
    background: #000;
    border: 2px solid var(--green-dim);
    outline: none;
  }

  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 40px;
    height: 24px;
    background: var(--green);
    border: none;
    cursor: pointer;
  }

  input[type="range"]::-moz-range-thumb {
    width: 40px;
    height: 24px;
    background: var(--green);
    border: none;
    cursor: pointer;
  }

  input[type="range"]::-moz-range-track {
    background: #000;
    height: 28px;
    border: 2px solid var(--green-dim);
  }

  #slider-label {
    text-align: center;
    margin-top: 12px;
    font-size: 0.8rem;
    color: var(--green-mid);
  }

  /* --- Loading screen --- */
  #load-screen { display: none; }

  .bar-outer {
    width: 100%;
    border: 2px solid var(--border);
    height: 26px;
    padding: 2px;
  }

  .bar-inner {
    height: 100%;
    width: 0%;
    background: var(--green);
  }

  #load-status {
    margin-top: 14px;
    font-size: 0.8rem;
    color: var(--green-mid);
    white-space: pre-line;
  }

  /* --- Library screen --- */
  #library-screen { display: none; }

  #library-screen .meta {
    font-size: 0.75rem;
    color: var(--green-mid);
    margin-bottom: 18px;
    border-bottom: 1px solid var(--green-dim);
    padding-bottom: 12px;
  }

  .entry {
    border: 1px solid var(--border);
    margin-bottom: 10px;
    padding: 12px 16px;
  }

  .entry a {
    color: var(--green);
    text-decoration: none;
    font-size: 0.9rem;
    display: block;
  }

  .entry a:hover {
    background: var(--green);
    color: #000;
  }

  .entry a:focus-visible {
    outline: 2px solid var(--green);
    outline-offset: 2px;
  }

  .empty, .error {
    font-size: 0.85rem;
    color: var(--green-mid);
  }

  .error { color: #ff4d4d; }

  footer {
    margin-top: 30px;
    font-size: 0.7rem;
    color: var(--green-dim);
  }
</style>
</head>
<body>

  <div class="header">
    <h1>SUPERIOR'S LIBRARY</h1>
    <div class="sub">local html archive // access terminal</div>
  </div>

  <div class="panel" id="unlock-screen">
    <div class="instructions line">SLIDE TO UNLOCK</div>
    <input type="range" id="unlock-slider" min="0" max="100" value="0">
    <div id="slider-label">0%</div>
  </div>

  <div class="panel" id="load-screen">
    <div class="line">SCANNING REPOSITORY...</div>
    <div class="bar-outer">
      <div class="bar-inner" id="bar-fill"></div>
    </div>
    <div id="load-status">initializing</div>
  </div>

  <div class="panel" id="library-screen">
    <div class="meta" id="library-meta"></div>
    <div id="library-list"></div>
  </div>

  <footer>superior's library // static index</footer>

  <script>
    const slider = document.getElementById('unlock-slider');
    const sliderLabel = document.getElementById('slider-label');
    const unlockScreen = document.getElementById('unlock-screen');
    const loadScreen = document.getElementById('load-screen');
    const libraryScreen = document.getElementById('library-screen');
    const barFill = document.getElementById('bar-fill');
    const loadStatus = document.getElementById('load-status');
    const libraryList = document.getElementById('library-list');
    const libraryMeta = document.getElementById('library-meta');

    let unlocked = false;

    slider.addEventListener('input', () => {
      sliderLabel.textContent = slider.value + '%';
      if (parseInt(slider.value, 10) >= 100 && !unlocked) {
        unlocked = true;
        beginUnlock();
      }
    });

    function beginUnlock() {
      unlockScreen.style.display = 'none';
      loadScreen.style.display = 'block';
      runLoadSequence();
    }

    function setBar(pct, text) {
      barFill.style.width = pct + '%';
      loadStatus.textContent = text;
    }

    async function runLoadSequence() {
      setBar(10, 'reading repository info');

      const host = window.location.hostname;
      const pathParts = window.location.pathname.split('/').filter(Boolean);

      // Owner is always the first segment of a *.github.io hostname.
      const owner = host.split('.')[0];
      // Project pages live at owner.github.io/repo/ ; user/org pages live at owner.github.io/
      const repo = pathParts.length > 0 ? pathParts[0] : (owner + '.github.io');

      try {
        setBar(30, 'contacting github api\nowner: ' + owner + '\nrepo: ' + repo);

        const repoRes = await fetch('https://api.github.com/repos/' + owner + '/' + repo);
        if (!repoRes.ok) throw new Error('repository lookup failed (' + repoRes.status + ')');
        const repoData = await repoRes.json();
        const branch = repoData.default_branch || 'main';

        setBar(60, 'walking file tree on branch: ' + branch);

        const treeRes = await fetch('https://api.github.com/repos/' + owner + '/' + repo + '/git/trees/' + branch + '?recursive=1');
        if (!treeRes.ok) throw new Error('tree lookup failed (' + treeRes.status + ')');
        const treeData = await treeRes.json();

        setBar(85, 'filtering .html entries');

        const files = (treeData.tree || [])
          .filter(item => item.type === 'blob' && /\.html?$/i.test(item.path))
          .filter(item => item.path.toLowerCase() !== 'index.html')
          .sort((a, b) => a.path.localeCompare(b.path));

        setBar(100, 'scan complete');

        setTimeout(() => showLibrary(files, owner, repo), 400);

      } catch (err) {
        setBar(100, 'scan failed');
        setTimeout(() => showError(err, owner, repo), 400);
      }
    }

    function showLibrary(files, owner, repo) {
      loadScreen.style.display = 'none';
      libraryScreen.style.display = 'block';

      libraryMeta.textContent = files.length + ' file(s) found // ' + owner + '/' + repo;

      if (files.length === 0) {
        libraryList.innerHTML = '<div class="empty">no html pages found in this repository.</div>';
        return;
      }

      libraryList.innerHTML = '';
      files.forEach(file => {
        const entry = document.createElement('div');
        entry.className = 'entry';
        const link = document.createElement('a');
        link.href = './' + file.path;
        link.textContent = file.path;
        entry.appendChild(link);
        libraryList.appendChild(entry);
      });
    }

    function showError(err, owner, repo) {
      loadScreen.style.display = 'none';
      libraryScreen.style.display = 'block';
      libraryMeta.textContent = owner + '/' + repo;
      libraryList.innerHTML = '<div class="error">error: could not scan repository.<br>' +
        (err && err.message ? err.message : 'unknown error') +
        '<br><br>this can happen if the repository is private, rate-limited, or the name could not be detected correctly.</div>';
    }
  </script>

</body>
</html>
