<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sky Hop</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      overflow: hidden; background: #0e1b31; font-family: system-ui, sans-serif;
    }
    #wrap { position: relative; width: min(94vw, 440px); aspect-ratio: 9 / 16; max-height: 92vh; }
    canvas { width: 100%; height: 100%; display:block; border-radius: 22px; box-shadow: 0 22px 70px #000a; touch-action: manipulation; }
    #hint { position:absolute; left:0; right:0; bottom: 17px; text-align:center; color:#fff; font-weight:800; font-size:12px; letter-spacing:.1em; text-shadow:0 2px 3px #0009; pointer-events:none; }
  </style>
</head>
<body>
  <main id="wrap" aria-label="Sky Hop game">
    <canvas id="game" width="450" height="800" aria-label="Press space, click, or tap to fly"></canvas>
    <div id="hint">SPACE / CLICK / TAP TO FLY</div>
  </main>
  <script>
    const canvas = document.querySelector('#game');
    const ctx = canvas.getContext('2d');
    const W = canvas.width, H = canvas.height;
    const bestKey = 'sky-hop-best';
    let state, last, clouds, pipes, bird, score, best;

    function reset() {
      state = 'ready'; last = 0; score = 0;
      best = +localStorage.getItem(bestKey) || 0;
      bird = { x: 132, y: H / 2, vy: 0, r: 19, tilt: 0 };
      pipes = []; clouds = [{x:50,y:135,s:1},{x:345,y:240,s:.7},{x:250,y:75,s:.55}];
    }
    function flap() {
      if (state === 'over') { reset(); state = 'playing'; }
      else if (state === 'ready') state = 'playing';
      bird.vy = -365;
    }
    function addPipe() {
      const gap = Math.max(170, 215 - score * 2.2);
      const top = 115 + Math.random() * (H - 270 - gap);
      pipes.push({ x: W + 35, top, gap, passed: false });
    }
    function circleRect(cx, cy, r, rx, ry, rw, rh) {
      const x = Math.max(rx, Math.min(cx, rx + rw)), y = Math.max(ry, Math.min(cy, ry + rh));
      return (cx-x)**2 + (cy-y)**2 < r*r;
    }
    function update(dt) {
      clouds.forEach(c => { c.x -= 10 * dt; if (c.x < -110) c.x = W + 90; });
      if (state !== 'playing') return;
      bird.vy += 900 * dt; bird.y += bird.vy * dt; bird.tilt = Math.min(0.55, Math.max(-.55, bird.vy / 700));
      if (!pipes.length || pipes[pipes.length - 1].x < W - 210) addPipe();
      pipes.forEach(p => {
        p.x -= (152 + score * 1.5) * dt;
        if (!p.passed && p.x + 70 < bird.x) { p.passed = true; score++; }
        if (circleRect(bird.x,bird.y,bird.r,p.x,0,70,p.top) || circleRect(bird.x,bird.y,bird.r,p.x,p.top+p.gap,70,H-(p.top+p.gap))) gameOver();
      });
      pipes = pipes.filter(p => p.x > -90);
      if (bird.y - bird.r < 0 || bird.y + bird.r > H - 62) gameOver();
    }
    function gameOver() {
      if (state !== 'playing') return;
      state = 'over'; best = Math.max(best, score); localStorage.setItem(bestKey, best);
    }
    function rounded(x,y,w,h,r,fill,stroke) {
      ctx.beginPath(); ctx.roundRect(x,y,w,h,r); if(fill) {ctx.fillStyle=fill;ctx.fill();} if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=4;ctx.stroke();}
    }
    function drawCloud(x,y,s) {
      ctx.fillStyle='#fff9'; ctx.beginPath();
      ctx.arc(x,y,25*s,0,7);ctx.arc(x+30*s,y-15*s,34*s,0,7);ctx.arc(x+66*s,y,27*s,0,7);ctx.arc(x+36*s,y+14*s,30*s,0,7);ctx.fill();
    }
    function drawPipe(p) {
      const pipe = (x,y,h,capY) => { rounded(x,y,70,h,9,'#22a95a','#0b6b3b'); rounded(x-8,capY,86,28,7,'#36ca6f','#0b6b3b'); ctx.fillStyle='#ffffff30';ctx.fillRect(x+12,y+8,11,Math.max(0,h-16)); };
      pipe(p.x,0,p.top,p.top-12); pipe(p.x,p.top+p.gap,H-(p.top+p.gap),p.top+p.gap);
    }
    function drawBird() {
      ctx.save(); ctx.translate(bird.x,bird.y);ctx.rotate(bird.tilt);
      ctx.fillStyle='#ffcd38';ctx.strokeStyle='#a55d19';ctx.lineWidth=4;
      ctx.beginPath();ctx.ellipse(0,0,25,19,0,0,7);ctx.fill();ctx.stroke();
      ctx.fillStyle='#f59c30';ctx.beginPath();ctx.ellipse(-9,7,13,9,-.45,0,7);ctx.fill();ctx.stroke();
      ctx.fillStyle='white';ctx.beginPath();ctx.arc(9,-8,9,0,7);ctx.fill();ctx.stroke();ctx.fillStyle='#172334';ctx.beginPath();ctx.arc(12,-7,3.5,0,7);ctx.fill();
      ctx.fillStyle='#f46d3d';ctx.beginPath();ctx.moveTo(23,2);ctx.lineTo(39,8);ctx.lineTo(23,13);ctx.closePath();ctx.fill();ctx.stroke();ctx.restore();
    }
    function draw() {
      const sky=ctx.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#5bd5f2');sky.addColorStop(1,'#c5f1ff');ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);
      clouds.forEach(c=>drawCloud(c.x,c.y,c.s)); pipes.forEach(drawPipe);
      ctx.fillStyle='#75c950';ctx.fillRect(0,H-62,W,62);ctx.fillStyle='#4b9d3c';for(let x=-20;x<W;x+=32){ctx.beginPath();ctx.arc(x,H-62,18,Math.PI,0);ctx.fill();}
      drawBird();
      ctx.textAlign='center';ctx.font='900 58px system-ui';ctx.lineWidth=7;ctx.strokeStyle='#1a3954aa';ctx.strokeText(score,W/2,88);ctx.fillStyle='white';ctx.fillText(score,W/2,88);
      if(state !== 'playing') {
        ctx.fillStyle='#10243bcc';rounded(42,state==='over'?265:292,W-84,state==='over'?205:156,22,'#10243be8','#fff8');
        ctx.fillStyle='white';ctx.font='900 34px system-ui';ctx.fillText(state==='over'?'FLIGHT OVER':'SKY HOP',W/2,state==='over'?315:345);
        ctx.font='700 18px system-ui';ctx.fillStyle='#d6f4ff';
        if(state==='over') { ctx.fillText(`Score: ${score}     Best: ${best}`,W/2,355); ctx.fillText('Tap, click, or press space to restart',W/2,410); }
        else {ctx.fillText('Thread the gaps. Don\'t touch the pipes!',W/2,384);ctx.fillText('Tap, click, or press space to begin',W/2,420);}
      }
    }
    function loop(t) { const dt=Math.min(.035,(t-last)/1000||0);last=t;update(dt);draw();requestAnimationFrame(loop); }
    addEventListener('keydown', e => { if(e.code==='Space'||e.code==='ArrowUp'){e.preventDefault();flap();} });
    canvas.addEventListener('pointerdown', flap); reset();requestAnimationFrame(loop);
  </script>
</body>
</html>
